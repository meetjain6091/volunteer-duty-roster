version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: meetjain6091/volunteer-duty-roster:1.0.0
    container_name: vdr-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
