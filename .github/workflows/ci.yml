name: Volunteer Duty Roster CI/CD

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compile and Static Analysis
      run: mvn -B clean compile

    - name: Run Unit Tests
      run: mvn -B test -Dtest="*ServiceTest"

    - name: Package WAR Artifact
      run: mvn -B package -DskipTests

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: volunteer-duty-roster-war
        path: target/volunteer-duty-roster.war
        retention-days: 7
