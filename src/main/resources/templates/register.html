<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">&#128197;</div>
            <h1>Create Account</h1>
            <p>Register as a volunteer</p>
        </div>

        <form th:action="@{/register}" method="post" th:object="${user}">
            <input type="hidden" name="role" value="VOLUNTEER"/>
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                       placeholder="Enter your full name" required>
                <div th:if="${#fields.hasErrors('fullName')}" class="form-error" th:errors="*{fullName}">Error</div>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" class="form-control"
                       placeholder="Choose a username" required>
                <div th:if="${#fields.hasErrors('username')}" class="form-error" th:errors="*{username}">Error</div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                       placeholder="Enter your email" required>
                <div th:if="${#fields.hasErrors('email')}" class="form-error" th:errors="*{email}">Error</div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control"
                       placeholder="Create a password" required>
                <div th:if="${#fields.hasErrors('password')}" class="form-error" th:errors="*{password}">Error</div>
            </div>
            <div class="form-group">
                <label for="phone">Phone (Optional)</label>
                <input type="text" id="phone" th:field="*{phone}" class="form-control"
                       placeholder="Enter your phone number">
            </div>
            <button type="submit" class="btn btn-primary" id="btn-register">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </div>
    </div>
</body>
</html>
