<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Volunteer Duty Roster - Manage volunteer assignments efficiently">
    <title th:text="${title} + ' | Volunteer Duty Roster'">Volunteer Duty Roster</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- Sidebar Fragment -->
<nav th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">
        <div class="brand-icon">&#128197;</div>
        <div>
            <h2>Duty Roster</h2>
            <small>Volunteer Management</small>
        </div>
    </div>

    <div class="sidebar-nav">
        <div class="nav-section">
            <div class="nav-section-title">Main</div>
            <a th:href="@{/dashboard}" class="nav-link" id="nav-dashboard">
                <span class="icon">&#127968;</span>
                <span>Dashboard</span>
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">Duties</div>
            <a th:href="@{/duties}" class="nav-link" id="nav-duties">
                <span class="icon">&#128203;</span>
                <span>All Duties</span>
            </a>
            <a th:href="@{/duties/create}" class="nav-link" id="nav-create-duty"
               sec:authorize="hasAnyRole('ADMIN','COORDINATOR')">
                <span class="icon">&#10133;</span>
                <span>Create Duty</span>
            </a>
            <a th:href="@{/duties/search}" class="nav-link" id="nav-search">
                <span class="icon">&#128269;</span>
                <span>Search</span>
            </a>
        </div>

        <div class="nav-section">
            <div class="nav-section-title">People</div>
            <a th:href="@{/volunteers}" class="nav-link" id="nav-volunteers">
                <span class="icon">&#128101;</span>
                <span>Volunteers</span>
            </a>
            <a th:href="@{/volunteers/create}" class="nav-link" id="nav-add-volunteer"
               sec:authorize="hasAnyRole('ADMIN','COORDINATOR')">
                <span class="icon">&#128100;</span>
                <span>Add Volunteer</span>
            </a>
        </div>
    </div>

    <div class="sidebar-footer">
        <div class="user-info">
            <div class="user-avatar" sec:authentication="name"
                 th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</div>
            <div class="user-details">
                <div class="user-name" sec:authentication="name">User</div>
                <div class="user-role" sec:authentication="principal.authorities">Role</div>
            </div>
        </div>
        <a th:href="@{/logout}" class="btn-logout" id="btn-logout">&#128682; Logout</a>
    </div>
</nav>

<!-- Alert Messages Fragment -->
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success">
        &#9989; <span th:text="${successMessage}">Success</span>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger">
        &#10060; <span th:text="${errorMessage}">Error</span>
    </div>
</div>

</body>
</html>
