<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo">&#128197;</div>
            <h1>Welcome Back</h1>
            <p>Sign in to Volunteer Duty Roster</p>
        </div>

        <!-- Alerts -->
        <div th:if="${param.error}" class="alert alert-danger">
            &#10060; Invalid username or password
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
            &#9989; You have been logged out successfully
        </div>
        <div th:if="${successMessage}" class="alert alert-success">
            &#9989; <span th:text="${successMessage}">Success</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Enter your username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required>
            </div>
            <button type="submit" class="btn btn-primary" id="btn-login">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </div>

        <div style="margin-top: 20px; padding: 14px; background: #f8fafc; border-radius: 8px; font-size: 12px; color: #64748b;">
            <strong>Demo Accounts:</strong><br>
            Admin: admin / admin123<br>
            Coordinator: coordinator / coord123<br>
            Volunteer: volunteer1 / vol123
        </div>
    </div>
</body>
</html>
