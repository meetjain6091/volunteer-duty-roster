# Production Configuration for Volunteer Duty Roster
spring.application.name=Volunteer Duty Roster (Production)
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Database: supports external MySQL via environment variables, with H2 memory fallback
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:volunteerdb_prod;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Thymeleaf Cache
spring.thymeleaf.cache=false

# Logging
logging.level.com.volunteer=INFO
logging.level.org.springframework.security=WARN
