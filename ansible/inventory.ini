# Ansible Inventory for Volunteer Duty Roster Node Provisioning
[app_servers]
target-node-01 ansible_host=127.0.0.1 ansible_connection=local

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
environment_name=production
app_name=volunteer-duty-roster
app_port=8080
deploy_user=rosteradmin
deploy_group=rostergroup
app_dir=/opt/volunteer-duty-roster
backup_dir=/opt/volunteer-duty-roster/backups
docker_image=meetjain6091/volunteer-duty-roster:1.0.0
previous_stable_image=meetjain6091/volunteer-duty-roster:0.9.0
